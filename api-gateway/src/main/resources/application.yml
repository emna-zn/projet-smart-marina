server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: port-service
              uri: ${PORT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/ports/**

            - id: pedestal-service
              uri: ${PEDESTAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/pedestals/**

            - id: consumption-service
              uri: ${CONSUMPTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/consumptions/**